{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Iniciar sesión - Cooperativa de Agua</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>

<body>

<div class="pantalla-login">

    <div id="fondo-3d-login" aria-hidden="true"></div>

    <div class="tarjeta-login">

        <div class="logo-login">
            <div class="icono">💧</div>
            <h1>Cooperativa de Agua</h1>
            <span>Ingresa con tu usuario para continuar</span>
        </div>

        {% if error %}
            <div class="error" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="grupo-campo">
                <label for="nombre_usuario">Usuario</label>
                <input
                    type="text"
                    id="nombre_usuario"
                    name="nombre_usuario"
                    autocomplete="username"
                    autofocus
                    required
                >
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-principal">
                Ingresar
            </button>

        </form>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{% static 'js/fondo3d.js' %}"></script>

</body>
</html>
